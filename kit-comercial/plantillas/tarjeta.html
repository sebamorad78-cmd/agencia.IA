<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta · CFMTS Labs</title>
<link rel="stylesheet" href="kit.css">
<style>
  @page { size: 85mm 55mm; margin: 0; }
  .card { width: 85mm; height: 55mm; position: relative; overflow: hidden; page-break-after: always; }
  .card:last-child { page-break-after: auto; }

  /* Frente */
  .front { background: var(--navy); color: #f3ece0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3.2mm; }
  .front img { width: 15mm; height: 15mm; }
  .front .word { font-size: 13pt; font-weight: 700; letter-spacing: .2em; }
  .front .word i { font-family: var(--serif); font-weight: 400; font-size: 16pt; letter-spacing: 0; color: var(--sand); margin-left: 1.2mm; }
  .front .tag { font-size: 6pt; letter-spacing: .26em; text-transform: uppercase; color: #9fb3bd; }
  .front svg.sea { position: absolute; left: 0; bottom: 0; width: 100%; height: 9mm; }

  /* Dorso */
  .back { background: var(--paper); padding: 6.5mm 7mm; display: grid; grid-template-columns: 1fr auto; gap: 4mm; }
  .back .who { display: flex; flex-direction: column; }
  .back .name { font-family: var(--serif); font-size: 17pt; line-height: 1; margin-top: 1mm; }
  .back .role { font-size: 6.6pt; letter-spacing: .18em; text-transform: uppercase; color: var(--sand-dark); font-weight: 700; margin-top: 1.6mm; }
  .back .lines { margin-top: auto; font-size: 7.2pt; display: grid; gap: .8mm; }
  .back .lines span { display: flex; gap: 2mm; }
  .back .lines em { font-style: normal; color: var(--muted); width: 13mm; }
  .back .qr { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5mm; }
  .back .qr svg { width: 21mm; height: 21mm; }
  .back .qr small { font-size: 5.4pt; color: var(--muted); text-align: center; line-height: 1.3; }
  .back .rule { position: absolute; left: 0; bottom: 0; height: 1.6mm; width: 100%; background: linear-gradient(90deg, #e9a35b, #d9aa68, #bdb27a, #93bc98, #5fc6c0); }
</style>
</head>
<body>
  <section class="card front">
    <img src="../../assets/brand/isotipo-solo.svg" alt="">
    <div class="word">CFMTS<i>Labs</i></div>
    <div class="tag">Inteligencia artificial para hotelería</div>
    <svg class="sea" viewBox="0 0 340 36" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 20 Q 28 10 56 20 T 113 20 T 170 20 T 226 20 T 283 20 T 340 20" fill="none" stroke="rgba(95,198,192,.35)" stroke-width="1"/>
      <path d="M0 28 Q 42 20 85 28 T 170 28 T 255 28 T 340 28" fill="none" stroke="rgba(95,198,192,.2)" stroke-width="1"/>
    </svg>
  </section>

  <section class="card back">
    <div class="who">
      <span class="eyebrow">CFMTS Labs</span>
      <div class="name">{{nombre}}</div>
      <div class="role">{{cargo}}</div>
      <div class="lines">
        <span><em>WhatsApp</em>{{whatsapp_visible}}</span>
        {{linea_email}}
        {{linea_web}}
        <span><em>Ciudad</em>{{ciudad}}</span>
      </div>
    </div>
    <div class="qr">
      {{qr_whatsapp}}
      <small>Escaneá y<br>escribinos</small>
    </div>
    <div class="rule"></div>
  </section>
</body>
</html>
